# Uzyj na PC z GPU AMD - device jest tu na sztywno ustawiony na "rocm". Ten sam plik
# dziala identycznie na kazdej maszynie z AMD (patrz docs/setup_windows_gpu.md -
# torch+ROCm na Windows ma ograniczone wsparcie, moze wymagac WSL2). Batch_size/
# precisions/phases sa CELOWO identyczne jak w ../CPU/ - dla poprawnego porownania
# urzadzen w pracy wazne jest, zeby macierz eksperymentow byla ta sama miedzy nimi.

experiment_name: "image_classification_mobilenet_cifar10_gpu_amd_v1"

task: "image_classification"
dataset: "cifar10"

models:
  - "mobilenet_v3"

devices:
  - rocm

precisions: ["fp32", "fp16"]
# 1 i 4 dolaczone obok 32/64 - patrz komentarz w
# ../CPU/image_classification_mobilenet_cifar10.yaml (hipoteza o przewadze CPU przy
# malych batchach). Ta sama macierz batch_sizes w kazdym folderze urzadzenia.
batch_sizes: [1, 4, 32, 64]

phases: ["train", "inference"]

# 3 niezalezne powtorzenia kazdej kombinacji (model x device x precision x batch_size x
# phase), zeby policzyc odchylenie std/wariancje - patrz docs/measurement_methodology.md.
repetitions: 3

train:
  num_epochs: 5
  learning_rate: 0.001
  optimizer: "adam"

inference:
  num_iterations: 50

warmup:
  enabled: true
  iterations: 5

power_meter:
  sampling_interval_ms: 100
  cpu_sources: ["zenpower", "rapl", "codecarbon"]
  gpu_sources: ["rocm_smi"]
  npu_sources: ["npu_native"]
  smart_plug:
    backend: "tuya"
    enabled: true

temperature_logging:
  enabled: true

output:
  save_to_supabase: true
  local_buffer_path: "./.local_buffer/"

seed: 42
