# Uzyj na laptopie/PC z Intel GPU - device jest tu na sztywno ustawiony na
# "intel_gpu_openvino". Drugi model klasyfikacji obrazow obok MobileNetV3 (patrz
# ../GPU_INTEL/image_classification_mobilenet_cifar10.yaml) - ResNet-50 zaadaptowany pod
# CIFAR-10 (32x32): pierwsza warstwa konwolucyjna zmniejszona z 7x7/stride2 do 3x3/stride1
# i usuniety pierwszy maxpool (patrz tasks/image_classification/models.py:build_resnet50).
#
# num_epochs ponizej jest nieuzywany (brak fazy "train" na tej sciezce), ale ustawiony na 2 -
# tak jak w wariantach CPU/GPU tego modelu - dla spojnosci configu. repetitions=2 (zamiast 3
# jak dla MobileNet) - ResNet-50 jest wolniejszy rowniez w inferencji (glebsza siec), patrz
# docs/measurement_methodology.md.

experiment_name: "image_classification_resnet50_cifar10_gpu_intel_v1"

task: "image_classification"
dataset: "cifar10"

models:
  - "resnet50"

devices:
  - intel_gpu_openvino

precisions: ["fp32"]
batch_sizes: [1, 4, 32, 64]

phases: ["inference"]

repetitions: 2

train:
  num_epochs: 2
  learning_rate: 0.001
  optimizer: "adam"

inference:
  num_iterations: 50

warmup:
  enabled: true
  iterations: 5

power_meter:
  sampling_interval_ms: 100
  cpu_sources: ["zenpower", "rapl", "codecarbon"]
  gpu_sources: ["nvml"]
  npu_sources: ["npu_native"]
  intel_gpu_sources: ["intel_gpu_native"]
  smart_plug:
    backend: "tuya"
    enabled: true

temperature_logging:
  enabled: true

output:
  save_to_supabase: true
  local_buffer_path: "./.local_buffer/"

seed: 42
