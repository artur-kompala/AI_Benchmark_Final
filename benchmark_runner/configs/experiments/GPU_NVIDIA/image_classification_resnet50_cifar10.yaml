# Uzyj na PC z GPU NVIDIA - device jest tu na sztywno ustawiony na "cuda". Drugi model
# klasyfikacji obrazow obok MobileNetV3 (../GPU_NVIDIA/image_classification_mobilenet_cifar10.yaml)
# - ResNet-50 zaadaptowany pod CIFAR-10 (32x32): pierwsza warstwa konwolucyjna zmniejszona
# z 7x7/stride2 do 3x3/stride1 i usuniety pierwszy maxpool (patrz
# tasks/image_classification/models.py:build_resnet50) - standardowa praktyka przy uzyciu
# ResNet na malych obrazach. Batch_sizes/precisions sa CELOWO identyczne jak w wariancie
# MobileNet i jak w ../CPU/image_classification_resnet50_cifar10.yaml - dla poprawnego
# porownania modeli i urzadzen w pracy wazne jest, zeby macierz eksperymentow byla ta sama.
#
# num_epochs=2 (ZAMIAST 5 jak w MobileNet) - CELOWA redukcja: ResNet-50 ma znacznie wyzszy
# koszt obliczeniowy na epoke niz MobileNetV3, a przy 5 epokach x pelny sweep na wielu
# maszynach czas bylby nierealny. repetitions=2 z tego samego powodu - patrz
# docs/measurement_methodology.md.

experiment_name: "image_classification_resnet50_cifar10_gpu_nvidia_v1"

task: "image_classification"
dataset: "cifar10"

models:
  - "resnet50"

devices:
  - cuda

precisions: ["fp32", "fp16"]
# 1 i 4 dolaczone obok 32/64 - patrz komentarz w
# ../CPU/image_classification_mobilenet_cifar10.yaml (hipoteza o przewadze CPU przy
# malych batchach).
batch_sizes: [1, 4, 32, 64]

phases: ["train", "inference"]

repetitions: 2

train:
  num_epochs: 2
  learning_rate: 0.001
  optimizer: "adam"

inference:
  num_iterations: 50

warmup:
  enabled: true
  iterations: 5

power_meter:
  sampling_interval_ms: 100
  cpu_sources: ["zenpower", "rapl", "codecarbon"]
  gpu_sources: ["nvml"]
  npu_sources: ["npu_native"]
  smart_plug:
    backend: "tuya"
    enabled: true

temperature_logging:
  enabled: true

output:
  save_to_supabase: true
  local_buffer_path: "./.local_buffer/"

seed: 42
