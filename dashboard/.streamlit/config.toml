# Deterministyczny jasny motyw - wykresy z dashboardu trafiaja wprost do pracy
# dyplomowej, wiec kolory i tlo musza byc stale niezaleznie od ustawien systemu.
#
# WAZNE (zweryfikowane w przegladarce, Streamlit 1.62): [theme] samo w sobie NIE
# pokrywa calej aplikacji - [theme.dark] i [theme.sidebar] sa OSOBNYMI sekcjami,
# ktore nie dziedzicza automatycznie kolorow z [theme]. Bez jawnego [theme.dark]
# przegladarka moze wybrac niezmodyfikowany ciemny motyw Streamlit (przelaczenie
# "System" po stronie frontendu, bez widocznego prze3acznika w UI); bez jawnego
# [theme.sidebar] pasek nawigacji zostaje ciemny nawet gdy reszta aplikacji jest
# jasna. Stad te same kolory powtorzone we wszystkich czterech sekcjach ponizej.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#0b0b0b"
font = "sans serif"

[theme.dark]
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#0b0b0b"
font = "sans serif"

[theme.sidebar]
primaryColor = "#2a78d6"
backgroundColor = "#f4f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b0b0b"

[theme.dark.sidebar]
primaryColor = "#2a78d6"
backgroundColor = "#f4f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b0b0b"

[server]
headless = true

[browser]
gatherUsageStats = false
